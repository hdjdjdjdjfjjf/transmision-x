<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Transmisión X</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;max-width:520px;margin:auto;background:#080808;position:relative}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:16px;background:linear-gradient(#000d,transparent);display:flex;justify-content:space-between}.logo{font-size:20px;font-weight:900}.logo b{color:#ff245c}.tabs{display:flex;gap:16px}.tabs button{background:none;color:#aaa;border:0}.tabs .on{color:#fff;font-weight:800}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video{height:100%;scroll-snap-align:start;position:relative;background:#17131d}.video video{width:100%;height:100%;object-fit:cover}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:80px;background:radial-gradient(circle,#30203d,#09070b)}.info{position:absolute;left:14px;right:72px;bottom:78px;text-shadow:0 2px 8px #000;font-size:14px}.user{font-weight:800;margin-bottom:8px}.caption{line-height:1.4}.actions{position:absolute;right:9px;bottom:80px;display:flex;flex-direction:column;gap:15px;align-items:center}.act{background:#0005;border:0;color:white;border-radius:50%;width:48px;height:48px;font-size:24px}.act small{display:block;font-size:9px;margin-top:2px}.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;height:62px;background:#050505f2;display:flex;justify-content:space-around;align-items:center}.nav{background:none;border:0;color:#ddd;font-size:10px}.nav strong{display:block;font-size:23px}.plus{background:#fff;color:#000;border-radius:9px;font-size:25px;width:46px;height:34px}.panel{position:absolute;z-index:20;inset:0;background:#0b0b0d;padding:22px;overflow:auto}.panel h2{margin-top:40px}.close{float:right;background:#222;color:#fff;border:0;border-radius:50%;width:36px;height:36px}.field{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #383838;background:#151515;color:#fff}.primary{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800}.msg{color:#ff6f91;font-size:13px}.hidden{display:none!important}.profileCard{padding:20px;background:#151515;border-radius:18px;margin-top:20px}.muted{color:#aaa}.comment{border-bottom:1px solid #292929;padding:12px 0}.toast{position:absolute;z-index:30;bottom:76px;left:50%;transform:translateX(-50%);background:#222;padding:10px 15px;border-radius:18px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body><div class="app">
<header class="top"><div class="logo">TRANSMISIÓN <b>X</b></div><div class="tabs"><button class="on" id="forYou">Para ti</button><button id="following">Siguiendo</button></div></header>
<main id="feed" class="feed"></main>
<nav class="bottom"><button class="nav" onclick="home()"> <strong>⌂</strong>Inicio</button><button class="nav" onclick="openSearch()"> <strong>⌕</strong>Buscar</button><button class="plus" onclick="openUpload()">＋</button><button class="nav" onclick="openActivity()"><strong>♡</strong>Actividad</button><button class="nav" onclick="openProfile()"><strong>◉</strong>Perfil</button></nav>
<div id="panel" class="panel hidden"></div><div id="toast" class="toast"></div></div>
<script>
let me=null, videos=[];
const $=s=>document.querySelector(s);
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Error');return d}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function closePanel(){ $('#panel').classList.add('hidden');$('#panel').innerHTML=''}
function home(){closePanel();loadFeed()}
function card(v){return '<article class="video" data-id="'+v.id+'">'+(v.videoUrl?'<video src="'+v.videoUrl+'" playsinline muted loop preload="metadata"></video>':'<div class="placeholder">✦</div>')+'<div class="info"><div class="user">@'+esc(v.username)+'</div><div class="caption">'+esc(v.caption||'')+'</div></div><div class="actions"><button class="act" onclick="like('+v.id+',this)">'+(v.liked?'♥':'♡')+'<small>'+v.likes+'</small></button><button class="act" onclick="comments('+v.id+')">💬<small>'+v.comments+'</small></button><button class="act" onclick="share()">↗<small>Compartir</small></button><button class="act" onclick="openProfileName(\''+esc(v.username)+'\')">◉<small>Perfil</small></button></div></article>'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadFeed(mode='forYou',q=''){try{const params=new URLSearchParams();if(mode==='following')params.set('mode','following');if(q)params.set('q',q);videos=await api('/api/videos'+(params.toString()?'?'+params:''));$('#feed').innerHTML=videos.length?videos.map(card).join(''):'<div class="video"><div class="placeholder">✦<div style="font-size:18px">Aún no hay videos. ¡Sé el primero!</div></div></div>';observer();}catch(e){toast(e.message)}}
function observer(){document.querySelectorAll('video').forEach(v=>{v.addEventListener('click',()=>v.paused?v.play():v.pause())});const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.play().catch(()=>{});api('/api/videos/'+v.closest('.video').dataset.id+'/view',{method:'POST'}).catch(()=>{})}else v.pause()}),{threshold:.7});document.querySelectorAll('video').forEach(v=>io.observe(v))}
async function like(id,el){try{const v=await api('/api/videos/'+id+'/like',{method:'POST'});el.innerHTML=(v.liked?'♥':'♡')+'<small>'+v.likes+'</small>'}catch(e){openAuth(e.message)}}
async function comments(id){let list=[];try{list=await api('/api/videos/'+id+'/comments')}catch(e){}$('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>Comentarios</h2><div id="comments">'+(list.map(c=>'<div class="comment"><b>@'+esc(c.username)+'</b><br>'+esc(c.text)+'</div>').join('')||'<p class="muted">Sé el primero en comentar.</p>')+'</div><form onsubmit="addComment(event,'+id+')"><input class="field" id="commentText" placeholder="Escribe un comentario…"><button class="primary">Comentar</button></form>'}
async function addComment(e,id){e.preventDefault();try{await api('/api/videos/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('#commentText').value})});comments(id)}catch(x){openAuth(x.message)}}
function share(){navigator.clipboard?.writeText(location.href);toast('Enlace copiado')}
function openAuth(msg=''){ $('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>Entrar en Transmisión X</h2><input id="email" class="field" type="email" placeholder="Correo"><input id="password" class="field" type="password" placeholder="Contraseña"><button class="primary" onclick="login()">Entrar</button><hr style="border-color:#333;margin:24px 0"><h2>Crear cuenta</h2><input id="username" class="field" placeholder="Usuario"><input id="email2" class="field" type="email" placeholder="Correo"><input id="password2" class="field" type="password" placeholder="Contraseña (6+ caracteres)"><button class="primary" onclick="register()">Crear cuenta</button><p class="msg">'+esc(msg)+'</p>'}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});me=d.user;closePanel();toast('Bienvenido @'+me.username);loadFeed()}catch(e){toast(e.message)}}
async function register(){try{const d=await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value.replace(/^@/,''),email:$('#email2').value,password:$('#password2').value})});me=d.user;closePanel();toast('Cuenta creada');loadFeed()}catch(e){toast(e.message)}}
async function openProfile(){if(!me){openAuth('Necesitas una cuenta para ver tu perfil.');return}openProfileName(me.username)}
async function openProfileName(name){try{const u=await api('/api/users/'+encodeURIComponent(name));$('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>@'+esc(u.username)+'</h2><div class="profileCard"><p>'+esc(u.bio||'Sin biografía todavía.')+'</p><p><b>'+u.followers+'</b> seguidores · <b>'+u.following+'</b> siguiendo · <b>'+u.videos+'</b> videos</p>'+(me&&me.id!==u.id?'<button class="primary" onclick="follow('+u.id+')">Seguir / dejar de seguir</button>':'')+'</div>'}catch(e){toast(e.message)}}
async function follow(id){if(!me){openAuth();return}try{const d=await api('/api/users/'+id+'/follow',{method:'POST'});toast(d.following?'Siguiendo':'Dejaste de seguir')}catch(e){toast(e.message)}}
function openUpload(){if(!me){openAuth('Inicia sesión para subir videos.');return}$('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>Publicar en Transmisión X</h2><form onsubmit="upload(event)"><input class="field" id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime" required><textarea class="field" id="caption" maxlength="300" placeholder="¿Qué quieres transmitir?"></textarea><button class="primary">Publicar video</button></form><p class="muted">Máximo recomendado: 100 MB.</p>'}
async function upload(e){e.preventDefault();const f=$('#videoFile').files[0];if(!f)return;const fd=new FormData();fd.append('video',f);fd.append('caption',$('#caption').value);try{await api('/api/videos',{method:'POST',body:fd});closePanel();toast('Video publicado');loadFeed()}catch(x){toast(x.message)}}
function openSearch(){$('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>Buscar videos</h2><form onsubmit="event.preventDefault();const q=$('#searchText').value.trim();closePanel();loadFeed('forYou',q)"><input id="searchText" class="field" placeholder="Buscar por descripción…"><button class="primary">Buscar</button></form>'}
function openActivity(){if(!me){openAuth('Inicia sesión para ver actividad.');return}$('#panel').classList.remove('hidden');$('#panel').innerHTML='<button class="close" onclick="closePanel()">×</button><h2>Actividad</h2><div class="profileCard"><p>Tu cuenta está activa.</p><button class="primary" onclick="logout()">Cerrar sesión</button></div>'}
async function logout(){try{await api('/api/auth/logout',{method:'POST'});me=null;closePanel();toast('Sesión cerrada');loadFeed()}catch(e){toast(e.message)}}
(async()=>{try{const d=await api('/api/me');me=d.user}catch{}loadFeed()})();
$('#forYou').onclick=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));$('#forYou').classList.add('on');loadFeed('forYou')};
$('#following').onclick=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));$('#following').classList.add('on');loadFeed('following').catch(()=>openAuth('Inicia sesión para ver Siguiendo.'))};
</script></body></html>
